#
# Uses the built-in GITHUB_TOKEN, not a separate PAT. Two consequences:
# - GITHUB_TOKEN cannot open or update PRs that touch .github/workflows/**,
#   so the github-actions manager is deliberately left out of
#   .github/renovate.json's enabledManagers (gomod only).
# - PRs GITHUB_TOKEN opens land in an approval-required state for their own
#   workflow runs (anti-recursion protection), so a maintainer needs to
#   approve each Renovate PR's checks manually.
name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # every day at 9:00 AM UTC

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          configurationFile: .github/renovate.json
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_REPOSITORIES: '["shivakunv/nvcf"]'
          RENOVATE_ONBOARDING: false
          LOG_LEVEL: debug
